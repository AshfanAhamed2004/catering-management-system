<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Staffing Requests')}">
  <title>Staffing Requests</title>
</head>
<body>
  <div th:replace="~{fragments/layout :: header('scheduling')}"></div>

  <main>
    <div class="flex-between mb-4" style="flex-wrap: wrap; gap: 16px;">
      <div>
        <div class="eyebrow">CREW SOURCING</div>
        <h1 style="margin: 4px 0 8px;">Staffing Requests</h1>
        <p class="muted" style="margin: 0;">Open requests for additional catering crew and kitchen personnel.</p>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Event Schedule</th>
            <th>Area &amp; Role</th>
            <th>Needed</th>
            <th>Status</th>
            <th>Requested At</th>
            <th>Notes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="q : ${requests}">
            <td>
              <strong th:text="${q.requirement.schedule.event.reference}">EVT-001</strong>
              <div class="muted small" th:text="${q.requirement.schedule.event.name}">Name</div>
            </td>
            <td>
              <span class="badge" th:text="${q.requirement.area}">EVENT</span>
              <span class="badge" th:text="${q.requirement.category}">SERVER</span>
            </td>
            <td><strong th:text="${q.numberNeeded}">1</strong> staff</td>
            <td>
              <span class="badge" th:text="${q.status}">OPEN</span>
            </td>
            <td><span class="muted small" th:text="${#temporals.format(q.requestedAt, 'MMM dd HH:mm')}">Date</span></td>
            <td><span class="muted small" th:text="${q.notes ?: '—'}">—</span></td>
            <td>
              <form th:if="${q.status == 'OPEN' or q.status == 'PARTIALLY_FULFILLED'}"
                    th:action="@{'/manager/requests/' + ${q.id} + '/cancel'}" method="post" style="margin:0;">
                <button type="submit" class="button danger btn-sm">Cancel</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="7" class="muted text-center" style="padding: 32px;">No active staffing requests found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
