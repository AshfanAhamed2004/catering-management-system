spring.application.name=SmartServe Staff Scheduling
server.port=${PORT:8082}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:smartserve_staff;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
server.servlet.session.cookie.name=STAFF_SCHEDULING_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.password=${DEMO_PASSWORD:DemoPassword123!}
app.resend.interval-seconds=${RESEND_INTERVAL_SECONDS:60}
app.resend.max-count=${MAX_RESEND_COUNT:3}

