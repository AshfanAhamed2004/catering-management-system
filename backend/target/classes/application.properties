spring.application.name=catering-api
server.port=8000
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/catering}
spring.datasource.username=${DB_USERNAME:catering}
spring.datasource.password=${DB_PASSWORD:YOUR_LOCAL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
app.jwt-secret=${JWT_SECRET:REPLACE_WITH_A_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS}
app.access-token-minutes=${ACCESS_TOKEN_MINUTES:30}
app.environment=${ENVIRONMENT:development}
app.dev-reset-tokens=${DEV_RESET_TOKENS:false}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.jackson.property-naming-strategy=SNAKE_CASE
