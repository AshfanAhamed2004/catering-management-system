<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Operation Notice')}">
  <title>Operation Notice</title>
</head>
<body>
  <div th:replace="~{fragments/layout :: header(null)}"></div>

  <main class="narrow">
    <div class="card" style="border-left: 5px solid #8b3430;">
      <div class="eyebrow" style="color: #8b3430;">NOTICE / ERROR</div>
      <h1>Request Issue</h1>
      <p class="error" th:text="${message}">An error occurred while processing your request.</p>

      <div class="actions" style="margin-top: 24px;">
        <a href="javascript:history.back()" class="button secondary">&larr; Return to Previous Page</a>
        <a th:href="@{/}" class="button">Go to Dashboard</a>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
